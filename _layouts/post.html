---
layout: default
---
{% assign t = site.data.topics[page.topic] %}
<article>
  <h1>{{ page.title }}</h1>
  <p class="meta">{{ page.date | date: "%-d %B %Y" }}{% if t %} · <a href="{{ '/efni/' | append: page.topic | append: '/' | relative_url }}">{{ t.name }}</a>{% endif %}</p>
  {{ content }}
</article>
