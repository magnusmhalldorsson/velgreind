<!doctype html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.tagline }}">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}">
</head>
<body>
<div class="wrap">

<header>
  <p class="site"><a href="{{ '/' | relative_url }}">Vélgreind</a></p>
  <p class="role">{{ site.author }} · {{ site.tagline }}</p>
  <nav>
    <a href="{{ '/' | relative_url }}">Dispatches</a>
    <a href="{{ '/um/' | relative_url }}">About</a>
    <a href="{{ '/feed.xml' | relative_url }}">Feed</a>
  </nav>
</header>

{{ content }}

<footer>
  Magnús M. Halldórsson, Reykjavik University.
  Dispatches are drafted with Claude and checked and signed off by me before they appear;
  see <a href="{{ '/um/' | relative_url }}">About</a>.
  The theory side of my work is at <a href="https://magnusmh.is">magnusmh.is</a>.
</footer>

</div>
</body>
</html>
